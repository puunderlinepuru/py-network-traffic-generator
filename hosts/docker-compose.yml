version: '5.3.1'

services:
  # Application 1
  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: py_client
    ports:
      - "8001:5000"  # Map port 5001 on host to 8000 inside container
    # environment:
    #   - APP_NAME=py_client
    #   # Pass connection details from App 2 or Database if needed
    #   - SERVICE_A=http://app-2:8000 
    
  # Application 2
  # interceptor:
  #   build:
  #     context: ./app-2
  #     dockerfile: Dockerfile
  #   container_name: my-app-2
  #   ports:
  #     - "5002:8000"
  #   environment:
  #     - SERVICE_B=http://app-3:8000

  # Application 3
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: py_server
    ports:
      - "8000:5000"
    # environment:
    #   - SERVICE_C=http://some-db (if you had a db)

networks:
  # Compose creates 'my-app-stack_default' automatically, 
  # but we can name it explicit for clarity.
  my-network:
    driver: bridge
